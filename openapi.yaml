      responses:
        '200': { description: Application detail }

  /api/company/applications/{application_id}/resume/:
    get:
      tags: [Company]
      security: [{ SessionCookie: [] }]
      summary: Download application resume
      parameters:
        - name: application_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: PDF resume }

  /api/company/applications/{application_id}/status/:
    put:
      tags: [Company]
      security: [{ SessionCookie: [] }]
      summary: Update application status
      parameters:
        - name: application_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Status updated }

  /api/admin/dashboard/:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: Admin dashboard metrics
      responses:
        '200': { description: Dashboard payload }

  /api/admin/students/:
