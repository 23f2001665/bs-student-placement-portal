          schema: { type: integer }
      responses:
        '200': { description: Company unblocked }

  /api/admin/drives/:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: List drives
      responses:
        '200': { description: Drive list }

  /api/admin/drives/pending/:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: List pending drives
      responses:
        '200': { description: Pending drive list }

  /api/admin/drives/{drive_id}/:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: View drive detail
      parameters:
