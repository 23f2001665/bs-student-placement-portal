        '200': { description: Drive summary list }

  /api/company/drives/create/:
    post:
      tags: [Company]
      security: [{ SessionCookie: [] }]
      summary: Create drive
      responses:
        '201': { description: Drive created }

  /api/company/drives/{drive_id}/:
    get:
      tags: [Company]
      security: [{ SessionCookie: [] }]
      summary: View applications for one drive
      parameters:
        - name: drive_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Drive applications }

  /api/company/drives/{drive_id}/summary/:
    get:
      tags: [Company]
      security: [{ SessionCookie: [] }]
      summary: View one drive summary
      parameters:
        - name: drive_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Drive summary }

  /api/company/drives/{drive_id}/update/:
    put:
      tags: [Company]
      security: [{ SessionCookie: [] }]
      summary: Update drive
      parameters:
        - name: drive_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Drive updated }

  /api/company/drives/{drive_id}/delete/:
    delete:
      tags: [Company]
      security: [{ SessionCookie: [] }]
      summary: Delete drive
      parameters:
        - name: drive_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Drive deleted }

  /api/company/applications/:
    get:
      tags: [Company]
      security: [{ SessionCookie: [] }]
      summary: List company applications
      responses:
        '200': { description: Application list }

  /api/company/applications/{application_id}/:
    get:
      tags: [Company]
      security: [{ SessionCookie: [] }]
      summary: View application detail
      parameters:
        - name: application_id
          in: path
          required: true
