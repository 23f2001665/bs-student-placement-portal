  /api/admin/drives/{drive_id}/approve/:
    put:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: Approve drive
      parameters:
        - name: drive_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Drive approved }

  /api/admin/drives/{drive_id}/reject/:
    put:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: Reject drive
      parameters:
        - name: drive_id
          in: path
          required: true
